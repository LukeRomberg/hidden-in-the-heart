<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hidden in the Heart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#efe3c6; --panel:#e2d2a8; --ink:#2a1e14; --mute:#6f5a40; --line:#8a6f4a;
  --ember:#b4401c; --gold:#a67a12; --leaf:#4f6b2a; --sky:#355c7a; --rose:#8c3a58; --violet:#6a4d80;
  --hp:#b4401c; --shield:#355c7a; --mana:#4f6b2a;
  --stone:#b9a27a; --stone2:#a88f66; --stone3:#c8b48c; --room:#3a2a1e; --path:#d8c6a0;
  --px-k:#1b1410; --px-r:#c8502a; --px-o:#e8903a; --px-y:#f2d25a; --px-w:#e8dcc0; --px-b:#4a6b8a;
  --px-g:#5a7a3a; --px-p:#6a4d80; --px-d:#5a4a3a; --px-s:#d8a878; --px-h:#6e7580; --px-j:#3d5a8a;
  --px-1:#8e95a0; --px-2:#6e7580; --px-3:#4e545c; --px-4:#4d6ea3; --px-5:#3d5a8a; --px-6:#2c4266; --px-S:#b8865a; --px-D:#7a6650; --px-W:#b9b0a0; --px-A:#8ab860; --px-B:#5a7a3a; --px-C:#3f5a28;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ color-scheme:dark;
    --bg:#17110d; --panel:#241a13; --ink:#e8dcc0; --mute:#a08c6c; --line:#5a4632;
    --ember:#e0683a; --gold:#f2c84a; --leaf:#8cb45a; --sky:#7aa6c8; --rose:#d86a92; --violet:#b48ad0;
    --hp:#e0683a; --shield:#7aa6c8; --mana:#8cb45a;
    --stone:#2a211b; --stone2:#221a15; --stone3:#332923; --room:#0e0a08; --path:#4a3a2c; }
}
:root[data-theme="dark"]{ color-scheme:dark;
  --bg:#17110d; --panel:#241a13; --ink:#e8dcc0; --mute:#a08c6c; --line:#5a4632;
  --ember:#e0683a; --gold:#f2c84a; --leaf:#8cb45a; --sky:#7aa6c8; --rose:#d86a92; --violet:#b48ad0;
  --hp:#e0683a; --shield:#7aa6c8; --mana:#8cb45a;
  --stone:#2a211b; --stone2:#221a15; --stone3:#332923; --room:#0e0a08; --path:#4a3a2c; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
*{ box-sizing:border-box; }
body{ margin:0; min-height:100%; background:var(--bg); color:var(--ink);
  font-family:'Pixelify Sans',system-ui,sans-serif; font-size:22px; line-height:1.25; -webkit-text-size-adjust:100%; }
h1,h2,h3,button,.px{ font-family:'Pixelify Sans',system-ui,sans-serif; }
h1{ font-size:18px; line-height:1.6; margin:0 0 12px; }
h2{ font-size:12px; line-height:1.6; margin:0 0 10px; color:var(--mute); }
.px{ font-size:10px; line-height:1.6; }
#app{ max-width:560px; margin:0 auto; padding:14px 12px 40px; }
.panel{ background:var(--panel); border:3px solid var(--line); box-shadow:4px 4px 0 var(--line); padding:12px; margin-bottom:14px; }
button{ font-size:10px; line-height:1.6; background:var(--panel); color:var(--ink); border:3px solid var(--ink);
  box-shadow:3px 3px 0 var(--ink); padding:10px 12px; margin:4px 4px 4px 0; cursor:pointer; text-align:left; }
button:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }
button:focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }
button:disabled{ opacity:.45; cursor:default; }
button.primary{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
button.wide{ display:block; width:100%; margin:6px 0; }
.row{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-start; }
.bar{ height:12px; border:2px solid var(--ink); background:var(--bg); position:relative; margin:4px 0; }
.bar i{ display:block; height:100%; }
.hp i{ background:var(--hp); } .sh i{ background:var(--shield); } .mn i{ background:var(--mana); }
.stat{ display:flex; justify-content:space-between; font-size:18px; }
.sprite{ image-rendering:pixelated; display:block; }
.hand{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.card{ border:3px solid var(--ink); background:var(--bg); padding:8px; cursor:pointer; box-shadow:3px 3px 0 var(--ink); }
.card:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }
.card .ref{ font-family:'Pixelify Sans',system-ui,sans-serif; font-size:9px; line-height:1.5; }
.card .type{ font-size:16px; }
.card .txt{ font-size:17px; color:var(--mute); margin:4px 0; }
.card .eff{ font-size:18px; }
.card.dim{ opacity:.45; }
.card.sel{ outline:4px solid var(--gold); }
.t-Patience{ color:var(--gold); } .t-Gentleness{ color:var(--leaf); } .t-Self-control{ color:var(--sky); }
.t-Peace{ color:var(--sky); } .t-Goodness{ color:var(--ember); } .t-Love{ color:var(--rose); }
.verse{ font-size:24px; line-height:1.35; margin:10px 0 14px; }
.blank{ display:inline-block; min-width:3.2em; border-bottom:3px solid var(--ink); text-align:center; padding:0 .2em; }
.ph{ color:var(--mute); letter-spacing:1px; } .ph.cur{ color:var(--gold); background:color-mix(in srgb, var(--gold) 20%, transparent); }
.blank.cur{ border-bottom-color:var(--gold); background:color-mix(in srgb, var(--gold) 25%, transparent); }
.blank.ok{ color:var(--leaf); border-bottom-color:var(--leaf); }
.blank.bad{ color:var(--ember); border-bottom-color:var(--ember); text-decoration:line-through; }
.opts button{ display:block; width:100%; margin:6px 0; font-family:'Pixelify Sans',system-ui,sans-serif; font-size:22px; }
input[type=text]{ font-family:'Pixelify Sans',system-ui,sans-serif; font-size:24px; padding:6px 8px; border:3px solid var(--ink); background:var(--bg); color:var(--ink); width:100%; }
.chip{ display:inline-block; border:3px solid var(--ink); background:var(--bg); padding:6px 10px; margin:4px; font-size:22px; cursor:pointer; box-shadow:3px 3px 0 var(--ink); }
.chip.placed{ opacity:.3; pointer-events:none; }
.chip.wrong{ border-color:var(--ember); color:var(--ember); }
.seq{ min-height:3.4em; border:3px dashed var(--line); padding:8px; margin:8px 0; font-size:22px; }
.toast{ position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%);
  background:var(--ink); color:var(--bg); padding:10px 14px; font-family:'Pixelify Sans',system-ui,sans-serif; font-size:10px;
  line-height:1.6; max-width:90vw; z-index:50; border:3px solid var(--gold); }
.frag{ color:var(--mute); } .frag.have{ color:var(--ink); }
.mute{ color:var(--mute); }
.small{ font-size:18px; }
.overlay{ position:fixed; inset:0; background:color-mix(in srgb, var(--bg) 92%, transparent); z-index:40; overflow:auto;
  padding:calc(14px + env(safe-area-inset-top,0px)) 12px calc(30px + env(safe-area-inset-bottom,0px)); }
.overlay .panel{ max-width:560px; margin:0 auto; }
.dmap{ display:block; }
.roomclick{ cursor:pointer; }
#wipe{ position:fixed; inset:0; z-index:60; pointer-events:none; display:none; background:#0e0a08; }
#wipe.on{ display:block; animation:wipein .3s steps(6) forwards; }
#wipe.off{ display:block; animation:wipeout .3s steps(6) forwards; }
@keyframes wipein{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes wipeout{from{clip-path:inset(0 0 0 0)}to{clip-path:inset(0 0 0 100%)}}
#app.enter{ animation:fadein .4s steps(5); }
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.story{ font-size:24px; line-height:1.4; }
.story p{ margin:0 0 14px; animation:fadein .6s steps(6) both; }
.story p:nth-child(2){ animation-delay:.6s } .story p:nth-child(3){ animation-delay:1.3s } .story p:nth-child(4){ animation-delay:2s }
.walk{ animation:walk .5s steps(1) infinite; } @keyframes walk{50%{transform:translateY(-2px)}}
.arena::after{ content:""; position:absolute; inset:0; pointer-events:none; box-shadow:inset 0 0 30px 6px rgba(0,0,0,.5); }

/* ----- arena ----- */
.arena{ position:relative; height:260px; overflow:hidden; border:3px solid var(--line); box-shadow:4px 4px 0 var(--line);
  background:#0e0a08; color:#e8dcc0; }
.arena.mini{ height:120px; margin-bottom:10px; }
.arena.shake{ animation:shake .4s steps(2) 2; }
@keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(-5px,3px)}50%{transform:translate(5px,-3px)}75%{transform:translate(-3px,-2px)}100%{transform:translate(0,0)}}
.bg svg{ position:absolute; inset:0; width:100%; height:100%; }
.glow{ position:absolute; left:15%; right:15%; bottom:0; height:70%; pointer-events:none;
  background:radial-gradient(ellipse at 50% 100%, rgba(240,120,40,.95), rgba(240,120,40,0) 70%); }
.ember{ position:absolute; width:3px; height:3px; background:#f2a040; bottom:-4px; opacity:0; animation:rise linear infinite; }
@keyframes rise{0%{transform:translateY(0);opacity:0}10%{opacity:1}100%{transform:translateY(-260px) translateX(12px);opacity:0}}
.plat{ position:absolute; height:12px; background:#2b2320; border-top:3px solid #4a3a2c; }
.plat.e{ right:6px; top:96px; width:170px; } .plat.p{ left:6px; bottom:4px; width:140px; }
.mini .plat.e{ top:60px; width:70px; } .mini .plat.p{ width:70px; }
.en{ position:absolute; animation:bob 1s steps(1) infinite; }
.en .f1{ display:none; }
.en.lunge .f0{ display:none; } .en.lunge .f1{ display:block; }
.en.hit{ animation:knock .3s steps(2) 1; } .en.hit .sprite{ filter:brightness(4); }
@keyframes knock{50%{transform:translateX(12px)}}
.en.wave .f0{ display:block; animation:tf 1s steps(1) infinite; } .en.wave .f1{ display:block; animation:tf 1s steps(1) infinite reverse; position:absolute; left:0; top:0; }
.en.windup{ animation:windup .45s steps(2) infinite; }
@keyframes windup{50%{transform:scale(1.14) translateX(-4px)}}
.en.lunge{ animation:lunge .4s steps(4) 1; }
@keyframes lunge{50%{transform:translate(-70px,50px)}}
@keyframes bob{50%{transform:translateY(-3px)}}
.pl{ position:absolute; left:6px; bottom:2px; }
.pl .f1{ display:none; } .pl.cast .f0{ display:none; } .pl.cast .f1{ display:block; }
.pl.hit{ animation:knock2 .3s steps(2) 1; } .pl.hit svg{ filter:brightness(3) sepia(1) hue-rotate(-50deg); }
@keyframes knock2{50%{transform:translateX(-10px)}}
.barrier{ position:absolute; left:104px; bottom:16px; width:10px; height:84px; opacity:.85;
  background:repeating-linear-gradient(0deg,#7aa6c8 0 6px,transparent 6px 12px); }
.vex{ position:absolute; left:52px; bottom:104px; font-family:'Pixelify Sans',system-ui,sans-serif; font-size:12px; color:#e0683a; animation:bob .4s steps(1) infinite; }
.info{ position:absolute; background:#17110d; border:3px solid #e8dcc0; padding:6px 8px; font-size:17px; min-width:140px; }
.info.e{ left:8px; top:8px; } .info.p{ right:8px; bottom:8px; }
.info .bar{ height:8px; border-color:#e8dcc0; background:#2b2320; margin:3px 0; }
.textbox{ border:3px solid var(--line); border-top:0; background:var(--panel); padding:8px 12px; font-size:20px; min-height:4.4em; box-shadow:4px 4px 0 var(--line); margin-bottom:12px; }
.textbox div{ color:var(--mute); } .textbox div:last-child{ color:var(--ink); }
.fx{ position:absolute; inset:0; pointer-events:none; }
.fxel{ position:absolute; left:0; top:0; }
.flash{ position:absolute; inset:0; background:#fff; animation:flash .35s steps(3) 1 forwards; }
@keyframes flash{0%{opacity:.9}100%{opacity:0}}
@keyframes fly{from{transform:translate(var(--sx),var(--sy))}to{transform:translate(var(--tx),var(--ty))}}
@keyframes radiate{from{transform:translate(var(--tx),var(--ty));opacity:1}to{transform:translate(calc(var(--tx) + var(--dx)),calc(var(--ty) + var(--dy)));opacity:0}}
@keyframes pop{from{opacity:0}to{opacity:1}}
@keyframes drop{from{height:0}to{height:var(--h)}}
@keyframes ring{from{transform:translate(var(--tx),var(--ty)) scale(.4);opacity:1}to{transform:translate(var(--tx),var(--ty)) scale(1.7);opacity:0}}
.weak{ opacity:.45; }
.fa{ animation:tf .5s steps(1) infinite; } .fb{ animation:tf .5s steps(1) infinite reverse; }
@keyframes tf{ 0%,49%{opacity:1} 50%,100%{opacity:0} }
/* ---- HUD ---- */
.hud{ position:sticky; top:env(safe-area-inset-top,0px); z-index:30; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  background:#17110d; color:#e8dcc0; border:3px solid var(--line); box-shadow:4px 4px 0 var(--line); padding:6px 10px; margin:0 0 14px; font-size:19px; }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:31; background:var(--bg); }
.hud .lv{ font-family:'Pixelify Sans',system-ui,sans-serif; font-size:10px; background:var(--gold); color:#17110d; padding:4px 6px; }
.hud .grow{ flex:1; min-width:90px; }
.hud .bar{ height:7px; border-color:#e8dcc0; background:#2b2320; margin:2px 0 0; }
.hud .it{ display:flex; align-items:center; gap:4px; white-space:nowrap; }
.hud .tiny{ font-size:15px; color:#a08c6c; }
.ico{ image-rendering:pixelated; display:inline-block; vertical-align:middle; }
/* ---- Tabs ---- */
.tabs{ position:fixed; left:0; right:0; bottom:0; z-index:35; display:flex; justify-content:center; background:#17110d; border-top:3px solid var(--line);
  padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px)); }
.tabs button{ flex:1; max-width:110px; margin:0 2px; background:transparent; color:#a08c6c; border:0; box-shadow:none; text-align:center; padding:6px 2px; font-size:8px; line-height:1.4; }
.tabs button:active{ transform:none; }
.tabs button.on{ color:#f2c84a; }
.tabs button .ico{ display:block; margin:0 auto 4px; }
.tabs .dot{ display:inline-block; width:6px; height:6px; background:#e0683a; margin-left:3px; vertical-align:top; }
body.has-tabs #app{ padding-bottom:calc(90px + env(safe-area-inset-bottom,0px)); }
/* ---- Dialogue ---- */
.dlg{ display:flex; gap:10px; align-items:flex-start; background:#17110d; color:#e8dcc0; border:3px solid var(--line); box-shadow:4px 4px 0 var(--line);
  padding:10px; margin-bottom:14px; min-height:104px; cursor:pointer; position:relative; -webkit-tap-highlight-color:transparent; }
.dlg .pt{ flex:0 0 60px; width:60px; height:60px; border:3px solid #5a4632; background:#2b2320; overflow:hidden; image-rendering:pixelated; }
.dlg .body{ flex:1; min-width:0; }
.dlg .who{ font-family:'Pixelify Sans',system-ui,sans-serif; font-size:9px; color:#f2c84a; margin-bottom:6px; }
.dlg .tw{ font-size:22px; line-height:1.3; min-height:2.6em; }
.dlg.narr .tw{ color:#c8b48c; font-style:italic; }
.dlg .more{ position:absolute; right:10px; bottom:6px; color:#f2c84a; font-size:14px; animation:tf .8s steps(1) infinite; }
.dlg .step{ position:absolute; right:10px; top:8px; font-size:14px; color:#6f5a40; }
.scene{ padding:0; overflow:hidden; margin-bottom:10px; }
.acts.hide{ visibility:hidden; }
/* ---- Cards ---- */
.ty-Patience{ --tc:var(--gold); } .ty-Gentleness{ --tc:var(--leaf); } .ty-Self-control{ --tc:var(--sky); } .ty-Peace{ --tc:var(--sky); } .ty-Goodness{ --tc:var(--ember); } .ty-Love{ --tc:var(--rose); } .ty-Armor{ --tc:var(--line); }
.card{ position:relative; border:3px solid var(--tc,var(--ink)); background:linear-gradient(180deg, color-mix(in srgb, var(--tc,var(--ink)) 16%, var(--bg)), var(--bg) 60%);
  box-shadow:3px 3px 0 var(--ink); padding:8px 8px 6px 10px; display:flex; flex-direction:column; min-height:150px; }
.card .gem{ position:absolute; top:-10px; left:-10px; width:28px; height:28px; background:var(--tc,var(--ink)); color:#17110d; border:3px solid var(--ink);
  font-family:'Pixelify Sans',system-ui,sans-serif; font-size:11px; display:flex; align-items:center; justify-content:center; }
.card .ref{ padding-left:14px; }
.card .type{ font-size:16px; color:var(--tc); padding-left:14px; }
.card .txt{ flex:1; }
.card .foot{ display:flex; justify-content:space-between; align-items:flex-end; border-top:2px dashed color-mix(in srgb, var(--tc,var(--ink)) 50%, transparent); padding-top:4px; font-size:18px; }
.card .glyphs{ color:var(--tc); letter-spacing:2px; font-size:17px; font-family:'Segoe UI Symbol','Apple Symbols','DejaVu Sans',system-ui,sans-serif; }
.card.spent{ opacity:.35; }
@media (prefers-reduced-motion: reduce){ .dlg .more{ animation:none; } }
@media (prefers-reduced-motion: reduce){ .en,.en.windup,.vex,.ember,.fa,.fb{ animation:none; } .fb{ opacity:0; } .arena.shake{ animation:none; } }

body{ font-size:19px; color:#f2deb0; }
body::before{ background:#2a1a0e; }
#app{ color:#f2deb0; }
h1{ font-size:26px; font-weight:700; color:#ffe8b0; text-shadow:2px 2px 0 #1e1008, -1px -1px 0 #1e1008; letter-spacing:.5px; }

const VERSES = [

  {ref:'Proverbs 16:32', type:'Patience', cost:2, dmg:10, text:'He who is slow to anger is better than a warrior, and he who controls his temper is greater than one who captures a city.'},
  {ref:'Ecclesiastes 7:9', type:'Self-control', cost:1, dmg:7, text:'Do not be quickly provoked in your spirit, for anger settles in the lap of a fool.'},
  {ref:'Colossians 3:8', type:'Goodness', cost:2, dmg:8, text:'But now you must put aside all such things as these: anger, rage, malice, slander, and filthy language from your lips.'},
  {ref:'Proverbs 14:29', type:'Patience', cost:1, dmg:7, text:'A patient man has great understanding, but a quick-tempered man promotes folly.'},
  {ref:'Psalm 37:8', type:'Peace', cost:1, shield:7, text:'Refrain from anger and abandon wrath; do not fret—it can only bring harm.'},
  {ref:'Romans 12:19', type:'Love', cost:3, dmg:14, text:'Do not avenge yourselves, beloved, but leave room for God’s wrath. For it is written: “Vengeance is Mine; I will repay, says the Lord.”'},
  {ref:'Philippians 4:7', type:'Peace', cost:2, heal:8, text:'And the peace of God, which surpasses all understanding, will guard your hearts and your minds in Christ Jesus.'},
  {ref:'John 11:35', type:'Love', cost:0, dmg:2, text:'Jesus wept.'},
  {ref:'Proverbs 19:11', type:'Patience', cost:2, dmg:9, text:'A man’s insight gives him patience, and his virtue is to overlook an offense.'},
  {ref:'Galatians 5:22-23', type:'Patience', cost:3, dmg:15, text:'But the fruit of the Spirit is love, joy, peace, patience, kindness, goodness, faithfulness, gentleness, and self-control. Against such things there is no law.'},
  {ref:'Galatians 5:16', type:'Self-control', cost:2, dmg:9, text:'So I say, walk by the Spirit, and you will not gratify the desires of the flesh.'},
];
const ARMOR_V = [
  {ref:'Ephesians 6:14', type:'Armor', cost:0, text:'Stand firm then, with the belt of truth buckled around your waist, with the breastplate of righteousness arrayed,'},
  {ref:'Ephesians 6:15', type:'Armor', cost:0, text:'and with your feet fitted with the readiness of the gospel of peace.'},
  {ref:'Ephesians 6:16', type:'Armor', cost:0, text:'In addition to all this, take up the shield of faith, with which you can extinguish all the flaming arrows of the evil one.'},

];
const STORY_V = [

];
const BY_REF = Object.fromEntries([...VERSES, ...ARMOR_V, ...STORY_V].map(v=>[v.ref,v]));
const ITEMS = {
  cap:{slot:'head', name:'Ball Cap', perk:'One wrong option is crossed off every multiple-choice blank.', price:15, up:'helm'},

  truth:{slot:'waist', name:'Belt of Truth', perk:'Perfect casts shield you for 2 and hit 25% harder.', verse:'Ephesians 6:14'},
  boots:{slot:'feet', name:'Work Boots', perk:'Heal 4 after every fight.', price:15, up:'sabatons'},

  bible:{slot:'hand', name:'Pocket Bible', perk:'+1 damage on every verse.', price:15, up:'sword'},

const SLOTS = {head:'Head', chest:'Chest', waist:'Waist', feet:'Feet', shield:'Off hand', hand:'Hand'};
function has(id){ return R && Object.values(R.gear).includes(id); }
function equip(id){
  const it=ITEMS[id]; const old=R.gear[it.slot];
  if(old==='vest'||old==='breast'){ R.maxHp-=6; R.hp=Math.max(1,R.hp-6); }
  if(old==='helm'){ R.maxHp-=10; R.hp=Math.max(1,R.hp-10); }
  R.gear[it.slot]=id;
  if(id==='vest'||id==='breast'){ R.maxHp+=6; R.hp+=6; }
  if(id==='helm'){ R.maxHp+=10; R.hp+=10; }
}
// Gear comes in a fixed order. The armor follows Ephesians 6:14-17, so each consecration recites the passage one verse further.
const PLAIN_ORDER = ['belt','vest','boots','cap'];
const ARMOR_CHAIN = [{up:'truth',from:'belt',n:1},{up:'breast',from:'vest',n:1},{up:'sabatons',from:'boots',n:2},{up:'faith',from:'lid',n:3},{up:'helm',from:'cap',n:4},{up:'sword',from:'bible',n:4}];
function owns(id){ const it=ITEMS[id]; return R.gear[it.slot]===id || (it.up && R.gear[it.slot]===it.up); }
function nextPlain(){ return PLAIN_ORDER.find(id=>!owns(id)) || null; }
function nextArmor(){ return ARMOR_CHAIN.find(a=>!has(a.up)) || null; }
function gearDrop(){ return nextPlain(); }

const STEPS = [

  {rooms:[{t:'shrine'}], frag:0},
  {rooms:[{t:'lock'},{t:'fight',e:['grudge']}], frag:1},
  {rooms:[{t:'fight',e:['brawler']}], frag:2},
  {rooms:[{t:'rest'},{t:'lock'}]},
  {rooms:[{t:'elite',e:['slanderer']},{t:'fight',e:['hothead']}], frag:3},
];

  if(name==='player'||name==='back'||name==='freed'){
    const view = name==='back'?'back':'front';
    return `<svg class="sprite ${cls||''}" viewBox="0 0 ${HERO.W} ${HERO.H}" width="${HERO.W*scale}" height="${HERO.H*scale}" shape-rendering="crispEdges" aria-hidden="true">${heroRects(view,frame,0,0,1,name==='freed')}</svg>`;
  }
  const rows = SPR[name][frame]; const w = rows[0].length, h = rows.length;
  let r = '';
  rows.forEach((row,y)=>{ for(let x=0;x<w;x++){ const c=row[x]; if(c!=='.') r += `<rect x="${x}" y="${y}" width="1" height="1" fill="var(${PAL[c]})"/>`; } });
  return `<svg class="sprite ${cls||''}" viewBox="0 0 ${w} ${h}" width="${w*scale}" height="${h*scale}" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`;
}

const TIER_PCT = [0.25,0.5,0.75,1], TIER_MULT = [1,1.25,1.5,2], TIER_NAME = ['Glimpsed','Familiar','Known','By heart'], TIER_GLYPH = ['\u25D4','\u25D1','\u25D5','\u25CF'];
PASS.ARMOR = {"book": "Ephesians", "ch": 6, "vs": [{"v": "14", "t": "Stand firm then, with the belt of truth buckled around your waist, with the breastplate of righteousness arrayed,"}, {"v": "15", "t": "and with your feet fitted with the readiness of the gospel of peace."}, {"v": "16", "t": "In addition to all this, take up the shield of faith, with which you can extinguish all the flaming arrows of the evil one."}, {"v": "17", "t": "And take the helmet of salvation and the sword of the Spirit, which is the word of God."}]};
function sp(ref){ return P.spell && P.spell[ref] ? P.spell[ref] : {n:1, tier:0, perf:0, fails:0}; }
function setSp(ref,s){ if(!P.spell) P.spell={}; P.spell[ref]=s; save(); }
function maxN(ref){ return PASS[ref] ? PASS[ref].vs.length : 1; }
function passVerses(ref, n){ return PASS[ref] ? PASS[ref].vs.slice(0,n) : [{v:ref.split(':').pop(), t:BY_REF[ref].text}]; }
function passRef(ref, n){ if(!PASS[ref]) return ref; const P_=PASS[ref], vs=P_.vs.slice(0,n); const a=vs[0].v.split('-')[0], b=vs[vs.length-1].v.split('-').pop(); return `${P_.book} ${P_.ch}:${a===b?a:a+'-'+b}`; }
function glyphs(ref){ const s=sp(ref); return Array.from({length:s.n},(_,i)=>i<s.n-1?TIER_GLYPH[3]:TIER_GLYPH[s.tier]).join(''); }
function spellLine(ref){ const s=sp(ref); return `${passRef(ref,s.n)} ${glyphs(ref)}`; }
function spellMult(ref){ const s=sp(ref); let m=0; for(let i=0;i<s.n;i++) m += TIER_MULT[i<s.n-1?3:s.tier]; return m; }
function spellCost(v){ return v.cost + sp(v.ref).n - 1; }
function spellEff(v){ const m=spellMult(v.ref); return v.dmg?`${Math.round(v.dmg*m)} dmg`: v.shield?`${Math.round(v.shield*m)} shield`:`heal ${Math.round(v.heal*m)}`; }
function recordResult(ref, frac){
  const s = {...sp(ref)}; const name = ()=>passRef(ref,s.n);
  if(frac===1){
    s.fails=0; s.perf++;
    if(s.perf>=3){ s.perf=0;
      if(s.tier<3){ s.tier++; toast(`${name()}: ${TIER_NAME[s.tier]}.`); }
      else if(s.n<maxN(ref)){ s.n++; s.tier=0; toast(`It grows. ${name()}.`); }
    }
  } else {
    s.fails++;
    if(s.fails>=3){ s.fails=0; s.perf=0;
      if(s.tier>0){ s.tier--; toast(`${name()} slips back to ${TIER_NAME[s.tier]}.`); }
      else if(s.n>1){ s.n--; s.tier=3; toast(`The newest verse slips away. ${name()}.`); }

/* ---------- Recall challenge ---------- */
function core(w){ return w.toLowerCase().replace(/[^a-z0-9]/g,''); }
const ALL_WORDS = [...new Set([...VERSES,...Object.values(PASS).flatMap(p=>p.vs.map(x=>({text:x.t})))].flatMap(v=>v.text.split(' ')).map(core).filter(w=>w.length>=4 && !/^\d+$/.test(w)))];
function words(verse){ return verse.text.replace(/\u2014/g,' \u2014 ').split(' ').filter(Boolean); }
function refParts(verse){ const m = verse.ref.match(/^(.+) (\d+):(\S+)$/); return {book:m[1], ch:m[2], vs:m[3]}; }
function shiftVs(vs, d){ if(/^\d+$/.test(vs)) return String(Math.max(1,+vs+d)); const [a,b]=vs.split('-').map(Number); return `${Math.max(1,a+d)}-${Math.max(2,b+d)}`; }
function refDistractors(kind, r){
  if(kind==='book'){ const books=[...new Set([...VERSES,...ARMOR_V].map(v=>refParts(v).book))].filter(b=>b!==r.book); return pick(books,3); }
  if(kind==='ch'){ const c=+r.ch; return [String(c+1), String(c>1?c-1:c+2), String(c+2)]; }
  return [shiftVs(r.vs,1), shiftVs(r.vs,-1), shiftVs(r.vs,2)];
}
function blankCount(v){ const s=sp(v.ref); const w=words({text:passVerses(v.ref,s.n).slice(-1)[0].t}).filter(x=>core(x)).length; return s.tier===3 ? w : Math.max(1,Math.ceil(w*TIER_PCT[s.tier])); }
function makeChallenge(verse, tierOverride, nOverride, priorTier){
  const s = sp(verse.ref); const n = nOverride||s.n; const tier = tierOverride!==undefined ? tierOverride : s.tier; const prior = priorTier!==undefined ? priorTier : 3;
  const vs = passVerses(verse.ref, n); const toks=[];
  vs.forEach((x,i)=>{ const t = i<n-1 ? prior : tier;
    if(n>1) toks.push({w:x.v.split('-')[0], kind:'num'});
    const ws = words({text:x.t}).map(w=>({w, kind:'word', vi:i}));
    if(t===3) ws.forEach(o=>{ if(core(o.w)) o.mode='letter'; });
    else { let cand = ws.map((o,j)=>j).filter(j=>core(ws[j].w).length>=3); if(!cand.length) cand=ws.map((o,j)=>j).filter(j=>core(ws[j].w));
      const k=Math.max(1,Math.ceil(ws.filter(o=>core(o.w)).length*TIER_PCT[t])); pick(cand,Math.min(k,cand.length)).forEach(j=>ws[j].mode='choice'); }
    toks.push(...ws);
  });
  const r = PASS[verse.ref] ? {book:PASS[verse.ref].book, ch:String(PASS[verse.ref].ch), vs:passRef(verse.ref,n).split(':').pop()} : refParts(verse);
  toks.push({w:'\u2014', kind:'sep'});
  [['book',r.book],['ch',r.ch],['vs',r.vs]].forEach(([k,w])=>{ const o={w, kind:k}; if(tier===3 || Math.random()<TIER_PCT[tier]) o.mode='choice'; toks.push(o); });
  const inVerse = new Set(toks.map(o=>core(o.w)));
  toks.forEach(o=>{ if(o.mode!=='choice') return;
    const ans = o.kind==='word' ? core(o.w) : o.w.toLowerCase(); o.ans=ans;
    let d = o.kind==='word' ? pick(ALL_WORDS.filter(w=>!inVerse.has(w) && Math.abs(w.length-ans.length)<=3),3) : refDistractors(o.kind, r).map(x=>x.toLowerCase());
    d = d.filter(x=>x!==ans); if(R && (has('cap')||has('helm'))) d = d.slice(0, Math.max(1,d.length-1));
    o.opts = shuffle([ans, ...d]); });
  toks.forEach(o=>{ if(o.mode==='letter') o.ans = core(o.w)[0]; });
  const order = toks.map((o,i)=>i).filter(i=>toks[i].mode);
  return {verse, toks, order, cur:0, n, tier, done:false, label:passRef(verse.ref,n)};
}
function openRecall(verse, onDone, tierOverride, title, nOverride, priorTier){ modal = {kind:'recall', c:makeChallenge(verse,tierOverride,nOverride,priorTier), onDone, title: title||'Cast'}; render(); }
function curTok(){ const c=modal.c; return c.toks[c.order[c.cur]]; }
function advance(){ const c=modal.c; if(c.cur < c.order.length-1) c.cur++; else c.done=true; }
function answer(val){ const o=curTok(); o.given = o.kind==='word' ? core(val) : String(val).trim().toLowerCase(); advance(); render(); }
function letterInput(el){
  const chars = el.value.toLowerCase().replace(/[^a-z0-9]/g,''); el.value='';
  for(const ch of chars){ if(modal.c.done) break; const o=curTok(); if(o.mode!=='letter') break; o.given=ch; advance(); }
  if(modal.c.done || curTok().mode!=='letter') render(); else { document.getElementById('rv').innerHTML=verseMarkup(); document.getElementById('rp').textContent=progressText(); }
}
function finishRecall(){ const c = modal.c; const right = c.order.filter(i=>c.toks[i].given===c.toks[i].ans).length; const fn = modal.onDone; modal = null; fn(right / c.order.length, c); }
function verseMarkup(){
  const c=modal.c; const curI=c.order[c.cur];
  return c.toks.map((o,i)=>{
    let sepBefore = i===0 ? '' : (o.kind==='vs' ? ':' : ' ');
    if(o.kind==='num') return `${sepBefore}<sup class="mute" style="font-size:.6em">${o.w}</sup>`;
    if(!o.mode) return sepBefore+o.w;
    const lead = o.kind==='word' ? (o.w.match(/^[^A-Za-z0-9]*/)||[''])[0] : ''; const trail = o.kind==='word' ? o.w.replace(/^[^A-Za-z0-9]*[A-Za-z0-9\u2019']*/,'') : '';
    const bare = o.kind==='word' ? o.w.slice(lead.length, o.w.length-trail.length) : o.w;
    if(o.given!==undefined){ const ok=o.given===o.ans;
      if(o.mode==='letter') return `${sepBefore}${lead}<span class="${ok?'t-Gentleness':'t-Goodness'}">${bare}</span>${trail}`;
      return `${sepBefore}${lead}<span class="blank ${ok?'ok':'bad'}">${ok?bare:o.given}</span>${trail}${ok||!c.done?'':`<span class="t-Gentleness"> ${bare}</span>`}`; }
    if(o.mode==='letter') return `${sepBefore}${lead}<span class="ph ${i===curI?'cur':''}">${'_'.repeat(Math.min(bare.length,7))}</span>${trail}`;
    return `${sepBefore}${lead}<span class="blank ${i===curI?'cur':''}">${i===curI?'?':'&nbsp;'}</span>${trail}`;
  }).join('');
}
function progressText(){ const c=modal.c; return `${c.done?c.order.length:c.cur} of ${c.order.length}`; }
function recallHTML(){
  const c = modal.c; const KIND = {word:'word', book:'book', ch:'chapter', vs:'verse'};
  let controls = '';
  if(c.done){ const right = c.order.filter(i=>c.toks[i].given===c.toks[i].ans).length;
    controls = `<div class="small mute">${right} of ${c.order.length} right${right===c.order.length?' \u2014 full power':''}</div><button class="primary wide" onclick="finishRecall()">Continue</button>`;
  } else if(curTok().mode==='letter'){
    controls = `<div class="small mute">From memory: type the first letter of each word.</div>
      <input id="ans" type="text" inputmode="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" oninput="letterInput(this)" style="text-align:center;font-size:28px;letter-spacing:.3em">`;
  } else { const o=curTok(); controls = `<div class="small mute">Missing ${KIND[o.kind]}</div><div class="opts">${o.opts.map(x=>`<button onclick="answer('${x.replace(/'/g,"\\'")}')">${x}</button>`).join('')}</div>`; }
  const s=sp(c.verse.ref);
  return `<div class="overlay"><div class="panel"><h2>${modal.title}</h2>
    <div class="small mute">${glyphs(c.verse.ref)} \u00b7 ${TIER_NAME[c.tier]} \u00b7 <span id="rp">${progressText()}</span></div>
    <div class="verse" id="rv">${verseMarkup()}</div>${controls}</div></div>`;
}

function roomX(n,i){ return n===1?56:(i===0?20:92); }
function mapHTML(){

/* ---------- Combat ---------- */
function startFight(ids, boss){

/* ---------- Spell effects ---------- */
function center(id){ const a=document.getElementById('arena'), el=document.getElementById(id); if(!a||!el) return {x:200,y:80}; const ar=a.getBoundingClientRect(), r=el.getBoundingClientRect(); return {x:r.left-ar.left+r.width/2, y:r.top-ar.top+r.height/2}; }
function fxel(style, anim, dur, delay, cls){ const fx=document.getElementById('fx'); if(!fx) return; const d=document.createElement('div'); d.className='fxel '+(cls||''); d.style.cssText=style+`;animation:${anim} ${dur}ms steps(${Math.max(3,Math.round(dur/70))}) ${delay}ms 1 forwards;opacity:0`; fx.appendChild(d); setTimeout(()=>d.remove(), dur+delay+50); }
const TYPE_COLOR = {Patience:'#f2d25a', Gentleness:'#8cb45a', 'Self-control':'#7aa6c8', Love:'#d86a92', Peace:'#cfe3f0', Goodness:'#fff2b0'};
async function castFX(type, tier, weak, from, to){
  const col = TYPE_COLOR[type]; const sz = (weak?0.6:1)*(tier===1?1: tier===2?1.5:2.2); const w=weak?'weak':'';
  const vars = `--sx:${from.x}px;--sy:${from.y}px;--tx:${to.x}px;--ty:${to.y}px`;
  const box = (wd,ht,extra='')=>`${vars};width:${wd}px;height:${ht}px;margin-left:${-wd/2}px;margin-top:${-ht/2}px;background:${col};${extra}`;
  let dur = 600;
  if(type==='Patience'){ fxel(box(44*sz,12*sz),'fly',dur,0,w); if(tier>1) fxel(box(28*sz,6*sz),'fly',dur,120,w); }
  else if(type==='Gentleness'){ const n=4*tier; for(let i=0;i<n;i++) fxel(box(7,7,`--sy:${from.y-30+(i*19)%60}px;--ty:${to.y-20+(i*23)%50}px`),'fly',dur,i*45,w); dur+=n*45; }
  else if(type==='Self-control'){ const n=7; for(let i=0;i<n;i++){ const f=i/(n-1); fxel(`${vars};--tx:${from.x+(to.x-from.x)*f}px;--ty:${from.y+(to.y-from.y)*f}px;width:${9*sz}px;height:${9*sz}px;background:${col};transform:translate(var(--tx),var(--ty))`,'pop',200,i*60,w); }
    fxel(`${vars};width:${60*sz}px;height:${60*sz}px;margin-left:${-30*sz}px;margin-top:${-30*sz}px;border:5px solid ${col}`,'ring',400,n*60,w); dur=n*60+400; }
  else if(type==='Love'){ fxel(box(16*sz,16*sz,`transform:translate(var(--tx),var(--ty))`),'pop',150,0,w); for(let i=0;i<8;i++){ const a=i*Math.PI/4; fxel(box(8*sz,8*sz,`--dx:${Math.cos(a)*40*sz}px;--dy:${Math.sin(a)*40*sz}px`),'radiate',450,150,w); } dur=600; }
  else if(type==='Peace'){ fxel(`--tx:${from.x}px;--ty:${from.y}px;width:${70*sz}px;height:${70*sz}px;margin-left:${-35*sz}px;margin-top:${-35*sz}px;border:5px solid ${col}`,'ring',550,0,w); for(let i=0;i<4;i++) fxel(box(10,10,`--tx:${from.x}px;--ty:${from.y}px;--dx:${[0,30,0,-30][i]}px;--dy:${[-30,0,30,0][i]}px`),'radiate',500,100,w); dur=600; }
  else if(type==='Goodness'){ fxel(`--h:${to.y+20}px;left:${to.x-7*sz}px;top:0;width:${14*sz}px;background:${col};height:0`,'drop',350,0,w); fxel(box(30*sz,10*sz,`transform:translate(var(--tx),var(--ty))`),'pop',200,300,w); dur=550; }
  if(tier===3 && !weak){ setTimeout(()=>{ const fx=document.getElementById('fx'), a=document.getElementById('arena'); if(fx){ const f=document.createElement('div'); f.className='flash'; fx.appendChild(f); setTimeout(()=>f.remove(),400); } if(a){ a.classList.add('shake'); setTimeout(()=>a.classList.remove('shake'),800); }
    for(let i=0;i<12;i++){ const ang=i*Math.PI/6; fxel(box(10,10,`--dx:${Math.cos(ang)*70}px;--dy:${Math.sin(ang)*70}px`),'radiate',500,0,''); } }, dur-150); dur+=350; }
  await sleep(dur);
}
async function freedFX(i){
  const el=document.getElementById('en'+i); if(!el) return; const c=center('en'+i);
  for(let k=0;k<10;k++){ const ang=k*Math.PI/5; fxel(`--tx:${c.x}px;--ty:${c.y}px;--dx:${Math.cos(ang)*50}px;--dy:${Math.sin(ang)*50}px;width:8px;height:8px;margin:-4px;background:#c8502a`,'radiate',500,0,''); }
  el.classList.remove('windup'); await sleep(450); const t=R.enemies[i]; if(t && t.fk===undefined) t.fk=pickFreed(); render(); await sleep(700);
}

/* ---------- Card play ---------- */
function playCard(i){
  if(R.busy) return;
  const c = R.hand[i]; const v = BY_REF[c.ref]; const cost = cardCost(v);
  if(cost>R.mana){ toast('Not enough mana'); return; }
  openRecall(v, async (frac)=>{
    R.busy=true; R.mana -= cost; R.vexed = false; R.hand.splice(i,1); R.spent.push(c); if(!R.castRefs.includes(c.ref)) R.castRefs.push(c.ref);
    if(R.tree.Gentleness>=3 && v.type==='Gentleness' && !R.gentleUsed) R.gentleUsed=true;
    P.casts[c.ref]=(P.casts[c.ref]||0)+1; save();
    let eff = frac; if(frac<1 && R.tree.Peace>=2 && !R.stumbleUsed){ R.stumbleUsed=true; eff=1; }
    let mult = eff===1?1: eff>0? 0.5+0.5*eff : 0.3;
    const SM = spellMult(c.ref); if(has('sword') && sp(c.ref).tier===3) mult *= 1.25;
    if(frac===1 && (has('belt')||has('truth'))) R.shield += 2;
    if(frac===1 && has('truth')) mult *= 1.25;
    recordResult(c.ref, frac);
    const weak = eff<1; const tier = v.dmg>=12?3: (v.dmg>=7||v.heal||v.shield)?2:1;
    let t = R.enemies[R.target]; if(!t||t.freed) t = R.enemies.find(e=>!e.freed); const ti = R.enemies.indexOf(t);
    render();
    const pl=document.getElementById('pl'); if(pl) pl.classList.add('cast');
    log(`You speak ${passRef(c.ref,sp(c.ref).n)}${weak?', haltingly':''}.`); if(frac<1&&!weak) log('Peace steadies your voice.');
    await castFX(v.type, tier, weak, center('pl'), v.dmg?center('en'+ti):center('pl'));
    if(pl) pl.classList.remove('cast');
    if(v.dmg){
      const base = v.dmg*SM + (R.tree.Patience>=1 && v.type==='Patience' ? 1 : 0) + (has('bible')?1:0) + (has('sword')?3:0);
      const dmg = Math.round(base*mult*(TYPE_MULT[v.type]||1)*(R.charge?2:1)); if(R.charge){ R.charge=false; log('The charged word lands.'); }
      if(R.tree.Gentleness>=1) R.shield += 2;
      if(R.tree.Patience>=3 && frac===1 && v.type==='Patience' && !t.boss){ t.stun=true; log(`${t.name} is dazed.`); }
      t.hp -= dmg; const el=document.getElementById('en'+ti); if(el){ el.classList.add('hit'); setTimeout(()=>el.classList.remove('hit'),320); }
      log(`${t.name} takes ${dmg}${TYPE_MULT[v.type]?' — '+v.type+' cuts through wrath':''}.`); await sleep(350);
      if(has('sabatons') && !t.boss && t.hp>0 && t.hp<=t.max*0.15){ log(`${t.name} lowers his fists. He doesn\u2019t want this anymore.`); t.hp=0; }
      if(t.hp<=0){ if(t.boss){ R.busy=false; bossAssembly('final'); return; } t.freed=true; const tal=5+(R.tree.Gentleness>=2?5:0); R.talents+=tal; R.earned.talents+=tal; gainXP(R.node&&R.node.t==='elite'?2:1); townUnlock(t.id); log(`${t.name} goes still. Something lets go of him.`); await freedFX(ti); log(THANKS[t.id]); }
      else if(t.boss) checkBossPhase(t);
    } else if(v.shield){ const s=Math.round(v.shield*SM*mult); R.shield+=s; log(`A barrier of ${s} rises.`); }
    else if(v.heal){ const h=Math.round(v.heal*SM*mult); R.hp=Math.min(R.maxHp,R.hp+h); log(`You breathe. Healed ${h}.`); }
    R.busy=false;
    if(modal){ render(); return; }
    if(R.enemies.every(e=>e.freed)){ fightWon(); return; }
    render();
  });
}
async function endTurn(){
  if(R.busy) return; R.busy=true;
  for(const e of R.enemies){ if(e.freed) continue;
    if(e.stun){ e.stun=false; log(`${e.name} stands dazed.`); await sleep(300); continue; }
    const a=e.pattern[e.step]; e.step=(e.step+1)%e.pattern.length; const i=R.enemies.indexOf(e);
    const el=document.getElementById('en'+i); if(el){ el.classList.remove('windup'); el.classList.add('lunge'); }
    await sleep(200);
    if(a==='vex'){ if(has('faith')) log(`${e.name} tries to provoke you. The Shield of Faith holds.`); else { R.vexed=true; log(`${e.name} provokes you. Your next verse costs more.`); } }
    else if(has('faith') && !R.faithUsed){ R.faithUsed=true; log(`${e.name}\u2019s blow glances off the Shield of Faith.`); }
    else { let d = a==='big'? e.atk+3 : e.atk; if(has('breast')) d=Math.max(0,d-2); const absorbed=Math.min(R.shield,d); R.shield-=absorbed; d-=absorbed; R.hp-=d;
      const pl=document.getElementById('pl'); if(pl){ pl.classList.add('hit'); setTimeout(()=>pl.classList.remove('hit'),320); }
      log(`${e.name} ${a==='big'?'slams':'strikes'} for ${d}${absorbed?' ('+absorbed+' absorbed)':''}.`); }
    await sleep(300); if(el) el.classList.remove('lunge');

// All nine fruit of the Spirit, grown from the ground up: the three from Emberford first, then one branch per mission.
const FRUIT = [

  {b:'Gentleness',   col:'#4f8a2a'},
  {b:'Peace',        col:'#4a9ad8'},
  {b:'Love',         col:'#c8507a', lock:'Mission 2, Hatred'},

  {b:'Kindness',     col:'#2e9a8a', lock:'Mission 4, Rivalry'},
  {b:'Goodness',     col:'#c8502a', lock:'Mission 5, Impurity'},
  {b:'Faithfulness', col:'#7a4d9a', lock:'Mission 6, Idolatry'},

const TW_=176, TH_=270, TX=88;
function branchY(k){ return 236 - k*25; }

function fruitPos(k,t){ const s=side(k); return [TX + s*(26 + t*21), branchY(k) - 4 - t*4]; }

function treeSVG(){
  let s = `<rect width="${TW_}" height="${TH_}" fill="#f3e2b6"/>`;
  // ground and roots
  s += `<rect y="${TH_-14}" width="${TW_}" height="14" fill="#b89a6a"/><rect y="${TH_-14}" width="${TW_}" height="2" fill="#8a6a48"/>`;
  s += `<polygon points="${TX-16},${TH_-12} ${TX-5},${TH_-26} ${TX+5},${TH_-26} ${TX+16},${TH_-12}" fill="#5a3c22"/>`;
  // canopy glow behind the grown part of the tree
  const top = FRUIT.findIndex(f=>f.lock); const reach = top<0 ? FRUIT.length : top;
  for(let k=0;k<reach;k++){ const y=branchY(k); s+=`<ellipse cx="${TX+side(k)*44}" cy="${y-8}" rx="44" ry="15" fill="#9cc46e" opacity=".22"/>`; }
  // trunk, tapering as it rises
  for(let y=TH_-26; y>branchY(8)-14; y-=2){ const w = 4 + (y-(branchY(8)-14))/(TH_-26-(branchY(8)-14))*7; s+=`<rect x="${TX-w}" y="${y-2}" width="${w*2}" height="2.2" fill="#6a4a2e"/><rect x="${TX-w}" y="${y-2}" width="1.4" height="2.2" fill="#8a6440"/>`; }
  // boughs
  FRUIT.forEach((f,k)=>{ const open=!f.lock; const g=open?(R.tree[f.b]||0):0; const sd=side(k); const y=branchY(k);
    const tip=fruitPos(k,2); s+=`<line x1="${TX}" y1="${y}" x2="${tip[0]+sd*8}" y2="${tip[1]-3}" stroke="${open?'#6a4a2e':'#b8a07a'}" stroke-width="${open?3:2}"/>`;
    for(let t=0;t<3;t++){ const [x,yy]=fruitPos(k,t); s+=`<line x1="${x}" y1="${yy+2}" x2="${x}" y2="${yy+5}" stroke="${open?'#6a4a2e':'#b8a07a'}" stroke-width="1"/>`; }
    if(open) for(let t=0;t<3;t++){ const [x,yy]=fruitPos(k,t); s+=`<ellipse cx="${x+sd*7}" cy="${yy-1}" rx="4" ry="2.4" fill="#5a8a3a"/><ellipse cx="${x-sd*7}" cy="${yy+1}" rx="3" ry="2" fill="#6e9a48"/>`; }
  });
  // fruit
  FRUIT.forEach((f,k)=>{ const open=!f.lock; const g=open?(R.tree[f.b]||0):0;
    for(let t=0;t<3;t++){ const [x,y]=fruitPos(k,t); const on=open&&g>t, next=open&&g===t, sel=R.treeSel&&R.treeSel.b===f.b&&R.treeSel.t===t; const c=f.col, sz=10;
      s+=`<g class="roomclick" role="button" tabindex="0" aria-label="${f.b} ${t+1}${f.lock?', locked':''}" onclick="treeSel('${f.b}',${t})" onkeydown="if(event.key==='Enter')treeSel('${f.b}',${t})">`;
      if(sel) s+=`<rect x="${x-sz/2-3}" y="${y-sz/2-3}" width="${sz+6}" height="${sz+6}" fill="${open?c:'#9a8a70'}" opacity=".3"/><rect x="${x-sz/2-2}" y="${y-sz/2-2}" width="${sz+4}" height="${sz+4}" fill="none" stroke="${open?c:'#9a8a70'}" stroke-width="1.2"/>`;
      if(!open){ s+=`<rect x="${x-sz/2}" y="${y-sz/2}" width="${sz}" height="${sz}" fill="#e2d2ac" stroke="#c0aa82" stroke-width="1"/>`; if(t===1) s+=pxg(LOCK,x-3.6,y-3.6,0.9); }
      else if(on){ s+=`<rect x="${x-sz/2}" y="${y-sz/2}" width="${sz}" height="${sz}" fill="${c}" stroke="#2a160c" stroke-width="1"/><rect x="${x-sz/2+1.5}" y="${y-sz/2+1.5}" width="3" height="3" fill="#fff" opacity=".7"/>`; }
      else s+=`<rect x="${x-sz/2}" y="${y-sz/2}" width="${sz}" height="${sz}" fill="#3a2616" stroke="${next?c:'#6a4a2e'}" stroke-width="${next?1.8:1}"/>`;
      s+=`</g>`; }
    const sd=side(k); const lx = TX + sd*46, ly = branchY(k) - 17;
    s+=`<text x="${lx}" y="${ly}" font-size="6" font-weight="700" font-family="'Pixelify Sans',sans-serif" fill="${f.lock?'#a8987a':f.col}" text-anchor="middle">${f.b}${open?` <tspan font-weight="500" fill="#8a6a48">${R.tree[f.b]||0}/3</tspan>`:''}</text>`;
  });
  return `<svg viewBox="0 0 ${TW_} ${TH_}" width="100%" shape-rendering="crispEdges" role="img" aria-label="The fruit of the Spirit">${s}</svg>`;
}
function treeHTML(){

async function finishAssembly(){

    if(m.mistakes===0){ render(); await freedFX(0); log(THANKS.furnace); fightWon(); return; }

  coin:["...kkkk...","..kyyyyk..",".kyywwyyk.",".kywyyyyk.",".kyyyyyyk.",".kyyyyyyk.",".kyyyyyyk.","..kyyyyk..","...kkkk...",".........."],
  town:["....k.....","...kyk....","..kyyyk...",".kyyyyyk..","kkkkkkkkk.",".kwwkwwk..",".kwwkwwk..",".kkk.kkk..",".kk...kk..",".kkkkkkk.."],
  church:["....y.....","...yyy....","....y.....","...kkk....","..kwwwk...",".kwwwwwk..",".kwwkwwk..",".kwwkwwk..",".kwkkkwk..",".kkkkkkk.."],
  gear:["..kkkkk...",".kwwwwwk..",".kwwywwk..",".kwyyywk..",".kwwywwk..",".kwwwwwk..","..kwwwk...","...kwk....","....k.....",".........."],
  tree:["...ggg....","..ggggg...",".ggrgggg..",".gggggrg..","..ggggg...","....d.....","....d.....","....d.....","...ddd....",".........."],
  deck:[".kkkkk....",".kwwwkk...",".kwkwkwk..",".kwwwkwk..",".kwkwkwk..",".kwwwkwk..",".kkkkkwk..","..kwwwwk..","..kkkkkk..",".........."],
};
function icon(n, s=2){ const rows=ICONS[n]; return `<svg class="ico" viewBox="0 0 10 10" width="${10*s}" height="${10*s}" shape-rendering="crispEdges" aria-hidden="true">${pxg(rows,0,0,1)}</svg>`; }
const HUD_ON = new Set(['town','church','forge','inn','training','scriptorium','world','tree','gear','deck','map','codex','intro']);
const TABS = [['town','Town','town'],['church','Church','church'],['gear','Gear','gear'],['tree','Tree','tree'],['deck','Deck','deck']];
const TAB_ON = new Set(['town','church','forge','inn','training','scriptorium','world','tree','gear','deck','codex']);
function hudHTML(){
  if(!R || !R.deck) return '';
  return `<div class="hud" role="status"><span class="lv">Lv ${R.level}</span>
    <span class="grow"><span class="it tiny">${icon('soul',1.6)} ${R.xp}/${xpNeed(R.level)} souls</span><div class="bar mn"><i style="width:${100*R.xp/xpNeed(R.level)}%"></i></div></span>
    <span class="it">${icon('heart',1.8)} ${R.hp}/${R.maxHp}</span><span class="it">${icon('mana',1.8)} ${R.maxMana}</span><span class="it">${icon('coin',1.8)} ${R.talents}</span></div>`;
}
function tabsHTML(){
  const cur = ['forge','inn','training','scriptorium','world'].includes(screen) ? 'town' : screen;
  return `<nav class="tabs">${TABS.map(([id,label,ic])=>`<button class="${cur===id?'on':''}" onclick="tab('${id}')">${icon(ic,2.2)}${label}${id==='tree'&&treeDue()>0?'<span class="dot"></span>':''}</button>`).join('')}</nav>`;
}
function tab(id){ if(modal) return; R.treeFrom='town'; R.gearFrom='town'; R.deckFrom='town'; R.codexFrom='town'; if(id==='tree') R.treeSel=null; goto(id); }

const PRIEST = ["....kkkk....","...kwwwwk...","..kwwwwwwk..","..kssssssk..","..ksksskssk.","..kssssssk..","..kwwsswwk..","...kwwwwk...","..kddddddk..",".kddddyddddk",".kdddyyydddk",".kddddyddddk"];
function portrait(who){
  if(who==='Priest') return `<svg viewBox="0 0 12 12" width="54" height="54" shape-rendering="crispEdges">${pxg(PRIEST,0,0,1)}</svg>`;
  if(who==='You') return `<svg viewBox="17 1 30 30" width="54" height="54" shape-rendering="crispEdges">${heroRects('front',0,0,0,1)}</svg>`;
  const map = {Blacksmith:'hothead_f', Innkeeper:'grudge_f', 'Drill master':'brawler_f', Scribe:'slanderer_f'};
  const E = ENEMY_IMG[map[who]]; if(!E) return '';
  return `<div style="width:54px;height:54px;background:url(${E.f[0]}) no-repeat;background-size:108px 144px;background-position:-27px -4px;image-rendering:pixelated"></div>`;
}
// A conversation is a list of [speaker, text]; speaker null means narration.
let TW = {key:null, i:0, typing:false, timer:null};
function talk(key, lines, actions, gate=true){
  if(TW.key!==key){ TW={key, i:0, typing:false, timer:null}; }
  const [who, text] = lines[Math.min(TW.i, lines.length-1)];
  const last = TW.i >= lines.length-1;
  return `<div class="dlg ${who?'':'narr'}" onclick="talkTap(${lines.length})" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' ')talkTap(${lines.length})" aria-label="Continue">
    ${who?`<div class="pt">${portrait(who)}</div>`:''}<div class="body">${who?`<div class="who">${who}</div>`:''}<div class="tw" id="tw" data-full="${text.replace(/"/g,'&quot;')}"></div></div>
    ${lines.length>1?`<span class="step">${TW.i+1}/${lines.length}</span>`:''}<span class="more" id="twmore" style="display:none">\u25BC</span></div>
    <div class="acts ${gate&&!last?'hide':''}" id="acts">${actions||''}</div>`;
}
function typeIt(){
  const el=document.getElementById('tw'); if(!el) return; clearInterval(TW.timer);
  const full=el.dataset.full; const quick = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(quick){ el.innerHTML=full; doneTyping(); return; }
  let n=0; TW.typing=true; el.textContent='';
  TW.timer=setInterval(()=>{ n+=2; el.innerHTML=full.slice(0,n); if(n>=full.length){ clearInterval(TW.timer); el.innerHTML=full; doneTyping(); } },22);
}
function doneTyping(){ TW.typing=false; const m=document.getElementById('twmore'); const acts=document.getElementById('acts'); const step=document.querySelector('.dlg .step');
  const total = step? +step.textContent.split('/')[1] : 1;
  if(TW.i < total-1){ if(m) m.style.display='block'; } else if(acts) acts.classList.remove('hide'); }
function talkTap(total){
  if(TW.typing){ clearInterval(TW.timer); const el=document.getElementById('tw'); el.innerHTML=el.dataset.full; doneTyping(); return; }
  if(TW.i < total-1){ TW.i++; render(); }
}

/* ---------- Town ---------- */
const BUILD = {
  church:{name:'Church', x:52, w:36, roof:'#5a4a6a', wall:'#8a7a6a', always:true},
  forge:{name:'Forge', x:6, w:30, roof:'#4a3a30', wall:'#7a6050'},
  inn:{name:'Inn', x:104, w:30, roof:'#6a3a2a', wall:'#9a7a5a'},
  training:{name:'Training Yard', x:14, w:30, roof:'#3a4a30', wall:'#7a7a5a', row:2},
  scriptorium:{name:'Scriptorium', x:96, w:30, roof:'#3a3a5a', wall:'#8a8aa0', row:2},
};
function townSVG(){
  let s = `<rect width="140" height="100" fill="#4a3448"/><rect width="140" height="22" fill="#6a4458"/><rect y="22" width="140" height="8" fill="#5a3c50"/>`;
  s += `<rect x="0" y="60" width="140" height="40" fill="#3a2e28"/>`;
  for(let x=0;x<140;x+=8) for(let y=62;y<100;y+=6) if((x+y)%3===0) s+=`<rect x="${x}" y="${y}" width="5" height="2" fill="#463830"/>`;
  s += `<rect x="62" y="84" width="16" height="16" fill="#2b2320"/><rect x="66" y="96" width="8" height="4" fill="#4a3a2c"/>`;
  Object.entries(BUILD).forEach(([id,b])=>{
    const open = b.always || P.town[id]; const y = b.row===2 ? 66 : 30; const hgt = id==='church'?34:24;
    const by = id==='church' ? 18 : y; const click = `class="roomclick" role="button" tabindex="0" onclick="enterBuilding('${id}')" onkeydown="if(event.key==='Enter')enterBuilding('${id}')"`;
    s += `<g ${click}><rect x="${b.x}" y="${by}" width="${b.w}" height="${hgt}" fill="${b.wall}" opacity="${open?1:.55}"/>`;
    s += `<polygon points="${b.x-3},${by} ${b.x+b.w/2},${by-10} ${b.x+b.w+3},${by}" fill="${b.roof}" opacity="${open?1:.55}"/>`;
    if(id==='church') s += `<rect x="${b.x+b.w/2-1}" y="${by-18}" width="2" height="8" fill="#f2d25a"/><rect x="${b.x+b.w/2-4}" y="${by-15}" width="8" height="2" fill="#f2d25a"/>`;
    const win = open ? '#f2c45a' : '#1a1210';
    s += `<rect x="${b.x+4}" y="${by+5}" width="6" height="6" fill="${win}"/><rect x="${b.x+b.w-10}" y="${by+5}" width="6" height="6" fill="${win}"/>`;
    s += `<rect x="${b.x+b.w/2-3}" y="${by+hgt-10}" width="6" height="10" fill="${open?'#3a2618':'#1a1210'}"/>`;
    if(!open) s += `<rect x="${b.x+2}" y="${by+hgt/2-1}" width="${b.w-4}" height="2" fill="#5a4030"/><rect x="${b.x+2}" y="${by+hgt/2+4}" width="${b.w-4}" height="2" fill="#5a4030"/>`;
    if(id==='forge' && open) s += `<rect x="${b.x+b.w-7}" y="${by-12}" width="4" height="8" fill="#4a3a30"/><rect x="${b.x+b.w-7}" y="${by-16}" width="4" height="3" fill="#e8903a" class="fa"/>`;
    s += `<text x="${b.x+b.w/2}" y="${by+hgt+5}" font-size="3.2" font-family="'Pixelify Sans',sans-serif" fill="#e8dcc0" text-anchor="middle">${open?b.name:'Boarded'}</text></g>`;
  });
  s += `<g class="roomclick" role="button" tabindex="0" onclick="goto('world')" onkeydown="if(event.key==='Enter')goto('world')"><rect x="58" y="84" width="24" height="3" fill="#6e4a2a"/><text x="70" y="93" font-size="3.2" font-family="'Pixelify Sans',sans-serif" fill="#e8dcc0" text-anchor="middle">Road</text></g>`;
  s += `<g>${heroRects('front',0,44,60,0.36)}</g>`;
  return `<svg viewBox="0 0 140 100" width="100%" shape-rendering="crispEdges" role="img" aria-label="Emberford">${s}</svg>`;
}
function enterBuilding(id){
  if(!(BUILD[id].always || P.town[id])){ toast({forge:'Boarded up. Someone in the square used to work here.', inn:'Boarded up. The innkeeper has not been seen in weeks.', training:'Boarded up. Whoever ran this yard left angry.', scriptorium:'Boarded up. A sign in the window has been scratched out.'}[id]); return; }
  goto(id==='forge'?'forge':id);
}
function townHTML(){
  saveHero();
  const open = ['forge','inn','training','scriptorium'].filter(k=>P.town[k]).length;
  return `<h1>Emberford</h1><div class="panel" style="padding:0;overflow:hidden">${townSVG()}</div>${statusHTML()}
    <div class="small mute" style="margin-bottom:8px">${open<4?`${4-open} building${4-open>1?'s are':' is'} still boarded up. The people who ran them are still out in the square.`:'Every door in town is open.'}</div>
    <div class="row">${['forge','inn','training','scriptorium'].map(k=>`<button ${P.town[k]?'':'disabled'} onclick="enterBuilding('${k}')">${BUILD[k].name}</button>`).join('')}<button onclick="goto('world')">Road</button></div>
    <div class="row" style="margin-top:8px"><button onclick="R.codexFrom='town';goto('codex')">Codex</button><button onclick="goto('title')">Title</button></div>`;
}
function churchHTML(){
  const cleared = P.missions.wrath;
  const line = !cleared ? '\u201cThe anger is worst in the square. Start there. Free who you can.\u201d'
    : '\u201cThe bell rang last night. People are coming back.\u201d He nods at the road. \u201cOther towns are worse off than we were.\u201d';
  return `<h1>The Church</h1>${talk('church'+(cleared?1:0),[['Priest',line]],'',false)}
    <h2>Missions</h2>
    <button class="primary wide" onclick="startMission()">Anger in the Square${cleared?' \u00b7 cleared '+cleared+'\u00d7':''}<br><span style="font-family:'Pixelify Sans',sans-serif;font-size:20px">Mission 1. Free the people of Emberford from wrath.</span></button>
    <button class="wide" disabled>${cleared?'The Road to Ashby \u00b7 coming soon':'??? \u00b7 clear the square first'}</button>
    <h2 style="margin-top:12px">The pews</h2>
    <button class="wide" onclick="R.trainFrom='church';goto('training')">Pray over your verses<br><span style="font-family:'Pixelify Sans',sans-serif;font-size:20px">Level your spells in quiet. The training yard pays 2 talents a drill.</span></button>
    ${R.hp<R.maxHp?`<button class="wide" ${R.talents<5?'disabled':''} onclick="R.talents-=5; R.hp=R.maxHp; saveHero(); toast('The priest binds your wounds.'); render()">Rest on a pew \u00b7 5 talents, heal fully</button>`:''}
`;
}
function startMission(){
  if(R.hp < R.maxHp*0.3){ toast('You can barely stand. Rest first.'); return; }
  Object.assign(R, {step:0, frags:[], node:null, enemies:[], helmUsed:false, boss:null});
  goto('mstory');
}
function mstoryHTML(){
  return `${talk('mstory',[
    [null,'The square again, darker than before. Every door is barred except the ones that have been kicked in.'],
    [null,'\u201cFor our struggle is not against flesh and blood, but against the rulers, against the authorities, against the powers of this world\u2019s darkness, and against the spiritual forces of evil in the heavenly realms.\u201d Ephesians 6:12'],
    ['Priest','\u201cThe people out there are not your enemies. They are the held. Say the true thing over them, and whatever has them lets go.\u201d']],
    `<button class="primary wide" onclick="goto('map')">Go in</button>`)}`;
}
function innHTML(){
  return `<h1>The Inn</h1>${talk('inn',[['Innkeeper','\u201cStew\u2019s on the house. Every time. I stopped keeping that kind of ledger.\u201d']],'',false)}
    <button class="primary wide" ${R.hp>=R.maxHp?'disabled':''} onclick="R.hp=R.maxHp; saveHero(); toast('Fed, warm, and healed.'); render()">${R.hp>=R.maxHp?'You are already rested':'Eat and sleep \u00b7 heal fully, free'}</button>
`;
}
function trainingHTML(){
  const yard = R.trainFrom!=='church';
  const refs = [...new Set(R.deck.map(c=>c.ref))].sort((a,b)=>sp(b.ref||b).fails-sp(a.ref||a).fails || (sp(a).n*4+sp(a).tier)-(sp(b).n*4+sp(b).tier));
  return `<h1>${yard?'The Training Yard':'The Pews'}</h1>${yard?talk('yard',[['Drill master','\u201cAgain. Until you can say it in your sleep. Which, I hear, is a problem for you.\u201d']],'',false):talk('pews',[[null,'Quiet. Candles. Nobody watching.']],'',false)}
    <div class="panel small">Three clean recitals level a spell up; three slips in a row knock it back down. A spell known fully by heart grows by adding the next verse. ${yard?'A clean drill here also earns 2 talents.':''}</div>
    ${refs.map(ref=>{ const s=sp(ref); return `<button class="wide" onclick="drill('${ref}',${yard})"><span class="t-${BY_REF[ref].type}">${spellLine(ref)}</span> \u00b7 ${TIER_NAME[s.tier]}<div class="bar mn" style="margin-top:6px"><i style="width:${Math.round(100*s.perf/3)}%"></i></div><span style="font-family:'Pixelify Sans',sans-serif;font-size:18px">${s.tier===3&&s.n>=maxN(ref)?'complete':`${s.perf}/3 perfect to ${s.tier<3?'level up':'add the next verse'}`}${s.fails?` \u00b7 ${s.fails}/3 slips`:''}</span></button>`; }).join('')}
    <button class="wide" onclick="goto(${yard?"'town'":"'church'"})">Back</button>`;
}
function drill(ref, yard){
  openRecall(BY_REF[ref], frac=>{
    recordResult(ref, frac);
    if(frac===1){ if(yard) R.talents+=2; toast(yard?'Clean. +2 talents.':'Clean.'); }
    else toast(sp(ref).fails?`Close. ${sp(ref).fails}/3 slips.`:'Close. It slipped a level.');
    saveHero(); render();
  }, undefined, yard?'Drill':'Pray');
}
function scriptoriumHTML(){
  const stock = VERSES.filter(v=>!R.deck.some(c=>c.ref===v.ref) && !v.ref.startsWith('Galatians'));
  const price = v=>10+5*v.cost;
  return `<h1>The Scriptorium</h1>${talk('scriptorium',[['Scribe','\u201cTrue words, this time. They cost something to copy.\u201d']],'',false)}
    ${stock.length?stock.map(v=>`<button class="wide" ${R.talents<price(v)?'disabled':''} onclick="learn('${v.ref}')"><span class="t-${v.type}">${v.ref}</span> \u00b7 ${price(v)} talents<br><span style="font-family:'Pixelify Sans',sans-serif;font-size:20px">${v.text}</span></button>`).join(''):'<div class="small mute">You have every verse he has copied so far.</div>'}
`;
}
function learn(ref){ const v=BY_REF[ref], c=10+5*v.cost; if(R.talents<c) return; R.talents-=c; addVerse(ref); saveHero(); toast(ref+' is yours.'); render(); }
function worldHTML(){
  const cleared = P.missions.wrath;
  const towns = [[30,70,'Emberford','Wrath',true],[78,52,'Ashby','???',false],[112,30,'Fennmarsh','???',false],[54,22,'Greyhollow','???',false]];
  let s = `<rect width="140" height="100" fill="#3e5a3a"/>`;
  for(let i=0;i<60;i++){ const x=(i*37)%140, y=(i*53)%100; s+=`<rect x="${x}" y="${y}" width="3" height="3" fill="#355030"/>`; }
  s += `<rect x="96" y="60" width="44" height="40" fill="#2f4a6a"/><rect x="0" y="0" width="34" height="18" fill="#5a5a5a"/>`;
  [[0,1],[1,2],[1,3]].forEach(([a,b])=>{ const A=towns[a],B=towns[b]; s+=`<line x1="${A[0]}" y1="${A[1]}" x2="${B[0]}" y2="${B[1]}" stroke="${cleared||a>0?'#c8a870':'#6e5a40'}" stroke-width="2" stroke-dasharray="${a===0&&cleared?'':'3 2'}"/>`; });
  towns.forEach(([x,y,n,v,here])=>{ s+=`<rect x="${x-5}" y="${y-5}" width="10" height="10" fill="${here?'#f2c45a':'#4a4038'}" stroke="#1b1410"/><text x="${x}" y="${y+11}" font-size="3.4" font-family="'Pixelify Sans',sans-serif" fill="#e8dcc0" text-anchor="middle">${here?n:'???'}</text>`; });
  s += `<g>${heroRects('front',0,22,46,0.2)}</g>`;
  return `<h1>The Road</h1><div class="panel" style="padding:0;overflow:hidden"><svg viewBox="0 0 140 100" width="100%" shape-rendering="crispEdges" role="img" aria-label="World map">${s}</svg></div>
    <div class="panel small">${cleared?'The road east to Ashby is open. Nobody in Emberford will say what is wrong there. The next town is still being built.':'The road out of town is blocked by the anger in the square. Clear it first.'}</div>
    <button class="primary wide" onclick="goto('town')">Back to Emberford</button>`;
}

/* ---------- Render ---------- */
function render(){
  const S = {town:townHTML, church:churchHTML, inn:innHTML, training:trainingHTML, scriptorium:scriptoriumHTML, world:worldHTML, mstory:mstoryHTML, pro1:pro1HTML, pro2:pro2HTML, pro3:pro3HTML, pro4:pro4HTML, title:titleHTML, codex:codexHTML, intro:introHTML, corridor:corridorHTML, bossintro:bossintroHTML, map:mapHTML, fight:fightHTML, reward:rewardHTML, shrine:shrineHTML, rest:restHTML, forge:forgeHTML, gear:gearHTML, study:studyHTML, tree:treeHTML, drop:dropHTML, lock:lockHTML, victory:victoryHTML, defeat:defeatHTML, deck:deckHTML};
  let html = (S[screen]||titleHTML)();
  if(R && HUD_ON.has(screen) && screen!=='intro') html = hudHTML() + html;
  const tabs = R && R.deck && R.deck.length && TAB_ON.has(screen); document.body.classList.toggle('has-tabs', !!tabs); if(tabs) html += tabsHTML();
  if(modal){ html += modal.kind==='recall'? recallHTML() : assemblyHTML(); }
  document.getElementById('app').innerHTML = html;
  const inp = document.getElementById('ans'); if(inp) inp.focus();
  if(document.getElementById('tw')) typeIt();
}
render();
</script>
